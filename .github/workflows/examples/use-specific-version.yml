# Example: pin to a specific version (tag or commit)
# Use this to stick to a stable release or a fixed version

name: 🚀 Release Dashboard

on:
  push:
    branches:
      - develop
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:

jobs:
  call-release-dashboard:
    # Version pinning examples:
    # @main - always use the latest
    # @v1.0.0 - use tag v1.0.0
    # @554e2c7 # v0.1.0 - pin by commit hash (recommended with version comment)
    uses: kyo-ago/release-dashboard-action/.github/workflows/release-dashboard.yml@554e2c7 # v0.1.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
