# Example: use the Sync Branches workflow
# After merging into main, it automatically merges main back into develop

name: 🔄 Sync Main to Develop

on:
  push:
    branches:
      - main  # Run automatically on push to main

jobs:
  sync-branches:
    uses: kyo-ago/release-dashboard-action/.github/workflows/sync-branches.yml@main
    permissions:
      contents: write
      pull-requests: write
    # with:
    #   develop_branch: 'develop'  # Custom develop branch name (optional)
    #   main_branch: 'main'        # Custom main branch name (optional)
    #   auto_merge: true           # Auto-merge when no conflicts (optional, default: true)
