# Example: use the reusable workflow with custom branch names
# Release flow: staging → production

name: 🚀 Release Dashboard (Staging → Production)

on:
  push:
    branches:
      - staging
  pull_request:
    types: [closed]
    branches:
      - staging
  workflow_dispatch:
    inputs:
      develop_branch:
        description: 'Develop branch name'
        required: false
        default: 'staging'
        type: string
      main_branch:
        description: 'Main branch name'
        required: false
        default: 'production'
        type: string

jobs:
  call-release-dashboard:
    uses: kyo-ago/release-dashboard-action/.github/workflows/release-dashboard.yml@554e2c7 # v0.1.0
    with:
      develop_branch: ${{ inputs.develop_branch || 'staging' }}
      main_branch: ${{ inputs.main_branch || 'production' }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
